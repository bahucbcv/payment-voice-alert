<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Received Voice Alert</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.app{max-width:440px;margin:auto;min-height:100vh;background:#fff;padding:20px}
h1{text-align:center;font-size:24px}.sub{text-align:center;color:#667085;margin-bottom:20px}
.card{border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0000000b}
label{font-weight:700;display:block;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:12px;font-size:18px}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-size:16px;font-weight:700;cursor:pointer;background:#1769ff;color:white}
.secondary{background:#eef2ff;color:#2446a8}.amount{text-align:center;font-size:30px;font-weight:800;margin:14px}
.timer{text-align:center;color:#d92d20;font-weight:700}.status{text-align:center;padding:12px;border-radius:12px;margin-top:12px;display:none}
.success{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}
.history-item{padding:12px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<div class="app">
<h1>💳 Payment Voice Alert</h1>
<div class="sub">Razorpay • Bengali Voice Notification</div>

<div class="card">
<label>Amount (₹)</label>
<input id="amount" type="number" min="1" step="0.01" placeholder="যেমন 500">
<button onclick="startPayment()">Generate Payment QR / Pay</button>
</div>

<div class="card">
<div id="amountShow" class="amount"></div>
<div id="timer" class="timer"></div>
<div id="status" class="status"></div>
<button class="secondary" onclick="testVoice()">🔊 Bengali Voice Test</button>
</div>

<div class="card">
<h3>Transaction History</h3>
<div id="history"></div>
</div>
</div>

<script>
let currentAmount=0, expiresAt=0, timerId=null;

function speak(text){
  if(!("speechSynthesis" in window)){ alert(text); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="bn-IN"; u.rate=.9; u.pitch=1;
  speechSynthesis.speak(u);
}

function moneyText(n){
  return "₹" + Number(n).toLocaleString("bn-IN") + " টাকা";
}

function showStatus(text, ok=true){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status "+(ok?"success":"error");
  el.style.display="block";
}

async function startPayment(){
  const amount=Number(document.getElementById("amount").value);
  if(!amount || amount<=0){ alert("দয়া করে Amount দিন"); return; }

  currentAmount=amount;
  document.getElementById("amountShow").textContent="₹"+amount.toFixed(2);
  document.getElementById("status").style.display="none";

  try{
    const r=await fetch("/api/create-order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({amount})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Order creation failed");

    expiresAt=Date.now()+5*60*1000;
    updateTimer();
    clearInterval(timerId);
    timerId=setInterval(updateTimer,1000);

    const options={
      key:"__RAZORPAY_KEY_ID__",
      amount:data.amount,
      currency:data.currency,
      name:"Payment Voice Alert",
      description:"Payment",
      order_id:data.orderId,
      handler:function(response){
        // Client success is only a UI signal. Final confirmation must come from verified webhook.
        showStatus("Payment submitted. Webhook confirmation pending…", true);
        speak("পেমেন্ট সাবমিট হয়েছে। কনফার্মেশন আসার অপেক্ষায়।");
        saveHistory({
          amount:currentAmount,
          status:"Submitted",
          paymentId:response.razorpay_payment_id,
          time:new Date().toLocaleString("bn-IN")
        });
      },
      modal:{ondismiss:function(){}},
      theme:{color:"#1769ff"}
    };
    new Razorpay(options).open();
  }catch(e){
    showStatus(e.message,false);
  }
}

function updateTimer(){
  const left=Math.max(0,expiresAt-Date.now());
  const s=Math.floor(left/1000),m=Math.floor(s/60),sec=s%60;
  document.getElementById("timer").textContent=left?`QR/Payment expires in ${m}:${String(sec).padStart(2,"0")}`:"Payment session expired";
  if(!left) clearInterval(timerId);
}

function testVoice(){
  speak("পেমেন্ট রিসিভ হয়েছে। "+moneyText(currentAmount||500)+" পেমেন্ট রিসিভ হয়েছে।");
}

function saveHistory(item){
  const a=JSON.parse(localStorage.getItem("paymentHistory")||"[]");
  a.unshift(item); localStorage.setItem("paymentHistory",JSON.stringify(a.slice(0,50))); renderHistory();
}

function renderHistory(){
  const a=JSON.parse(localStorage.getItem("paymentHistory")||"[]");
  document.getElementById("history").innerHTML=a.length?a.map(x=>
    `<div class="history-item"><b>₹${Number(x.amount).toFixed(2)}</b><br><span class="small">${x.status} • ${x.time}<br>${x.paymentId||""}</span></div>`
  ).join(""):"<div class='small'>কোনও transaction নেই</div>";
}
renderHistory();
</script>
</body>
</html>
